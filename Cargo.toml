[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/inference",
    "crates/runtime_api",
    "crates/runtime_llamacpp",
    "daemon",
    "cli",
]
# Deferred code lives under archive/ and is intentionally not built.
exclude = ["archive/runtime_candle", "archive/runtime_diffusion"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ohmygpu/ohmygpu"

[workspace.dependencies]
# Internal crates
ohmygpu_core = { path = "crates/core" }
ohmygpu_inference = { path = "crates/inference" }
ohmygpu_runtime_api = { path = "crates/runtime_api" }
ohmygpu_runtime_llamacpp = { path = "crates/runtime_llamacpp" }
ohmygpu_daemon = { path = "daemon" }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7" }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http-body-util = "0.1"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde-saphyr = "1"        # YAML for hand-authored recipes (serde_yaml is archived)
schemars = "1"            # JSON Schema generation for the recipe format
semver = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.33"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"

# Build release binaries and publish a GitHub Release when a `v*` tag is pushed
# (`make version patch|minor|major && make push`). `workflow_dispatch` only builds
# and uploads artifacts — no release without a tag.
#
# Action majors are the Node 24 ones (checkout@v5, upload-artifact@v6, download-artifact@v7,
# action-gh-release@v3, rust-cache@v2 ≥ 2.9); bump them together when GitHub moves runtimes again.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (ubuntu, mock backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       optional: true }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    optional: true }
    runs-on: ${{ matrix.os }}
    # `optional` targets (Intel Mac, Windows) must not block the release: Intel runners come and go,
    # and Windows is not yet verified in CI. Their assets are simply missing from the release if they fail.
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          # Version-less asset names so https://github.com/ohmygpu/ohmygpu/releases/latest/download/<name> always works.
          name="ohmygpu-${{ matrix.target }}"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ohmygpu-runtime$ext" \
             "target/${{ matrix.target }}/release/ohmygpu$ext" \
             README.md LICENSE "dist/$name/"
          cd dist
          case "${{ matrix.target }}" in
            *windows*) 7z a -tzip "$name.zip" "$name" >/dev/null ;;
            *)         tar czf "$name.tar.gz" "$name" ;;
          esac
          rm -r "$name"
          ls -la
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # whisper.cpp publishes no macOS binaries, so we build `whisper-server` for
  # the pinned tag (WHISPER_DEFAULT_RELEASE in crates/core/src/config.rs) and
  # attach it to the release; the runtime downloads it from there on macOS.
  whisper:
    name: whisper-server ${{ matrix.arch }} (macOS)
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   arch: arm64 }
          - { os: macos-15-intel, arch: x64, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v5
      - name: resolve whisper.cpp tag
        id: tag
        run: |
          tag=$(grep -oE 'WHISPER_DEFAULT_RELEASE: &str = "[^"]+"' crates/core/src/config.rs | grep -oE '"[^"]+"' | tr -d '"')
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "whisper.cpp tag: $tag"
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ steps.tag.outputs.tag }}
          path: whisper.cpp
      - name: build whisper-server (static, Metal embedded)
        run: |
          cmake -S whisper.cpp -B whisper-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build whisper-build --config Release --target whisper-server -j
          whisper-build/bin/whisper-server --help | head -3
      - name: package
        run: |
          set -euo pipefail
          name="whisper-${{ steps.tag.outputs.tag }}-bin-macos-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp whisper-build/bin/whisper-server whisper.cpp/LICENSE "dist/$name/"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -r "dist/$name"
          ls -la dist
      - uses: actions/upload-artifact@v6
        with:
          name: whisper-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [build, whisper]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          # download-artifact may nest files per artifact; flatten so every asset sits in dist/
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
